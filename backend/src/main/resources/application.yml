spring:
  application:
    name: ecommerce-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ecommerce
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong}
  expiration: 900000 # 15 minutes in milliseconds

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: DEBUG
